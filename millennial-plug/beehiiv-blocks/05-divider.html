<!-- THE MILLENNIAL PLUG — Perforated divider
     Drop between sections. This is the Milk Road milk-carton trick: a dashed rule
     reads as a tear-away perforation and gives you a branded section break for
     almost no visual cost. Use it 2-3 times per page maximum — past that it
     stops being a signature and becomes noise. -->
<div class="tmp-divider-root">
  <style>
    .tmp-divider-root{--ink:#14131A}
    .tmp-divider-root .tmp-perf{
      height:0; border:0;
      border-top:3px dashed var(--ink);
      opacity:.28; margin:0;
    }
  </style>

  <hr class="tmp-perf">
</div>
